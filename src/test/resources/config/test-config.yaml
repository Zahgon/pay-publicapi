# Configuration of the service under test (Micronaut property names, see src/main/resources/application.yml).
micronaut:
  server:
    host: 127.0.0.1
    port: -1

publicapi:
  admin-port: 0
  base-url: http://publicapi.url/
  connector-url: http://connector_card.url/
  public-auth-url: http://publicauth.url/v1/api/auth
  ledger-url: http://ledger.url/
  allow-http-for-return-url: false
  api-key-hmac-secret: qwer9yuhgf
  # Caching authenticator.
  authentication-cache-policy: expireAfterWrite=0s
  ecs-container-metadata-uri-v4: ""

rest-client:
  disabled-secure-connection: "true"

rate-limiter:
  no-of-req: 1000
  per-millis: 1000
  no-of-req-for-post: 1000
  no-of-req-per-node: 1
  no-of-req-for-post-per-node: 1
  elevated-accounts: 1, 2, 3
  no-of-req-for-elevated-accounts: 1000
  no-of-post-req-for-elevated-accounts: 1000
  low-traffic-accounts:
  no-of-req-for-low-traffic-accounts: 1
  no-of-post-req-for-low-traffic-accounts: 1
  interval-in-millis-for-low-traffic-accounts: 1000

redis:
  endpoint: localhost:6379
  ssl: false
  command-timeout: 250ms
  connect-timeout: 100ms
  reconnect-delay-lower-bound: 100ms
  reconnect-delay-upper-bound: 10000ms
  reconnect-delay-base: 100
